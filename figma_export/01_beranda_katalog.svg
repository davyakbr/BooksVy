    <text x="770" y="437" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Semua</text>

    <rect x="820" y="415" width="130" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="885" y="437" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">Bisnis &amp; Finansial</text>

