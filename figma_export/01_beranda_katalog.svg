    <rect x="1080" y="175" width="110" height="155" rx="8" fill="#047857" transform="rotate(4 1080 175)"/>
    <rect x="1140" y="185" width="110" height="155" rx="8" fill="#0F172A" transform="rotate(10 1140 185)"/>
