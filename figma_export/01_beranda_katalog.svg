    <text x="77" y="125" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">HABITS</text>
    <text x="155" y="42" font-size="11" font-weight="700" fill="#10B981">SELF IMPROVEMENT</text>
