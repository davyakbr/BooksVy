    <rect x="155" y="160" width="140" height="34" rx="8" fill="#10B981"/>
    <text x="225" y="182" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Keranjang</text>
  </g>

  <!-- Card 5 -->
