    <rect width="395" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="15" y="15" width="125" height="180" rx="10" fill="#475569"/>
    <text x="77" y="105" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">RICH DAD</text>
    <text x="77" y="125" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle">POOR DAD</text>
    <text x="155" y="42" font-size="11" font-weight="700" fill="#64748B">FINANSIAL</text>
    <text x="155" y="65" font-size="15" font-weight="700" fill="#0F172A">Rich Dad Poor Dad</text>
    <text x="155" y="85" font-size="12" fill="#64748B">Penulis: Robert Kiyosaki</text>
    <text x="155" y="105" font-size="11" font-weight="600" fill="#EF4444">✕ Stok Habis</text>
    <text x="155" y="145" font-size="17" font-weight="800" fill="#94A3B8">Rp 78.000</text>
