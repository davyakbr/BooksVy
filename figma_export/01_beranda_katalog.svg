    <text x="140" y="215" font-size="34" font-weight="800" fill="#FFFFFF">Temukan Buku Favoritmu di Books<tspan fill="#34D399">Vy</tspan></text>
    <text x="140" y="250" font-size="15" fill="#D1FAE5" font-weight="400">Toko buku online terpercaya dengan ribuan koleksi best-seller, akademik, &amp; sastra.</text>
