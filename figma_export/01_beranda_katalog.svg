    <rect x="15" y="15" width="125" height="180" rx="10" fill="#831843"/>
    <text x="77" y="105" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">BERANI TIDAK</text>
    <text x="77" y="125" font-size="12" font-weight="700" fill="#FBCFE8" text-anchor="middle">DISUKAI</text>
    <text x="155" y="42" font-size="11" font-weight="700" fill="#DB2777">PSIKOLOGI</text>
    <text x="155" y="65" font-size="15" font-weight="700" fill="#0F172A">Berani Tidak Disukai</text>
    <text x="155" y="85" font-size="12" fill="#64748B">Penulis: Ichiro Kishimi</text>
    <text x="155" y="105" font-size="11" fill="#10B981">✓ Stok Tersedia: 7 buku</text>
    <text x="155" y="145" font-size="17" font-weight="800" fill="#064E3B">Rp 98.000</text>
    <rect x="155" y="160" width="140" height="34" rx="8" fill="#10B981"/>
    <text x="225" y="182" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Keranjang</text>
