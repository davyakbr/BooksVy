    <rect x="0" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="20" y="25" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">&lt;</text>

    <rect x="50" y="0" width="40" height="40" rx="8" fill="#10B981"/>
    <text x="70" y="25" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>

    <rect x="100" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="120" y="25" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">2</text>

    <rect x="150" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="170" y="25" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">&gt;</text>
  </g>

  <!-- Footer Minimal -->
  <rect y="1030" width="1440" height="50" fill="#0F172A"/>
  <text x="80" y="1061" font-size="12" fill="#94A3B8">© 2026 BooksVy Bookstore — Hak Cipta Dilindungi</text>
  <text x="1360" y="1061" font-size="12" fill="#94A3B8" text-anchor="end">Sistem Informasi Penjualan Buku Online Modern</text>
