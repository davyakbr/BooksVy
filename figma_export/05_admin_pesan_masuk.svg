      <text x="985" y="28" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">Menunggu Tanggapan</text>
      <rect x="920" y="44" width="70" height="28" rx="6" fill="#10B981"/>
      <text x="955" y="62" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Balas ➔</text>
      <text x="1010" y="62" font-size="14" fill="#EF4444" cursor="pointer">🗑️</text>

      <line x1="10" y1="80" x2="1050" y2="80" stroke="#F1F5F9" stroke-width="1.5"/>
    </g>

    <!-- Message Row 2: Menunggu Tanggapan (13:24 WIB) -->
    <g transform="translate(20, 170)">
      <text x="20" y="24" font-size="12" font-weight="700" fill="#1E293B">24/11/2026</text>
      <text x="20" y="42" font-size="11" fill="#64748B">13:24 WIB</text>

      <text x="190" y="24" font-size="13" font-weight="700" fill="#0F172A">Rizky Maulana</text>
      <text x="190" y="42" font-size="11" fill="#64748B">rizky.m@yahoo.com</text>

      <rect x="400" y="10" width="110" height="24" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="455" y="26" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Stok Buku</text>

      <text x="590" y="24" font-size="12" font-weight="700" fill="#1E293B">Tanya restock buku Rich Dad Poor Dad</text>
      <text x="590" y="42" font-size="11" fill="#64748B">Apakah buku Rich Dad Poor Dad akan ready lagi minggu ini?</text>

      <rect x="920" y="12" width="130" height="24" rx="12" fill="#FEF3C7"/>
      <text x="985" y="28" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">Menunggu Tanggapan</text>
      <rect x="920" y="44" width="70" height="28" rx="6" fill="#10B981"/>
      <text x="955" y="62" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Balas ➔</text>
      <text x="1010" y="62" font-size="14" fill="#EF4444" cursor="pointer">🗑️</text>

      <line x1="10" y1="80" x2="1050" y2="80" stroke="#F1F5F9" stroke-width="1.5"/>
    </g>

    <!-- Message Row 3: Sudah Dibalas (19/11/2026) -->
    <g transform="translate(20, 265)">
      <text x="20" y="24" font-size="12" font-weight="700" fill="#1E293B">19/11/2026</text>
      <text x="20" y="42" font-size="11" fill="#64748B">09:15 WIB</text>

      <text x="190" y="24" font-size="13" font-weight="700" fill="#0F172A">Siti Rahma</text>
      <text x="190" y="42" font-size="11" fill="#64748B">siti.rahma@gmail.com</text>

      <rect x="400" y="10" width="130" height="24" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="465" y="26" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Konfirmasi Transfer</text>

      <text x="590" y="24" font-size="12" font-weight="700" fill="#1E293B">Sudah transfer via BCA</text>
      <text x="590" y="42" font-size="11" fill="#64748B">Terlampir bukti transfer untuk pesanan 2 buku filosofi...</text>

      <!-- Balasan info -->
      <rect x="590" y="52" width="300" height="22" rx="4" fill="#F0FDF4"/>
      <text x="600" y="67" font-size="10" fill="#15803D">✓ Admin telah membalas pesan ini</text>

      <rect x="920" y="12" width="95" height="24" rx="12" fill="#DCFCE7"/>
      <text x="967" y="28" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Sudah Dibalas</text>
      <rect x="920" y="44" width="70" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="955" y="62" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">Lihat</text>
