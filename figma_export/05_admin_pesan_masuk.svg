      <text x="190" y="42" font-size="11" fill="#64748B">andrian@gmail.com</text>

      <!-- Topik -->
      <rect x="400" y="10" width="120" height="24" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="460" y="26" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Status Pengiriman</text>
      <text x="400" y="45" font-size="10" fill="#2563EB">#BVY-20261124-91</text>

      <!-- Isi Pesan -->
      <text x="590" y="24" font-size="12" font-weight="700" fill="#1E293B">Kapan pesanan saya dikirim kurir?</text>
      <text x="590" y="42" font-size="11" fill="#64748B">Halo admin, saya sudah transfer tadi siang pukul 12.30...</text>

      <!-- Status & Aksi -->
