    <text x="35" y="53" font-size="11" fill="#64748B">Selasa, 24 November 2026 &bull; Jam Operasional Layanan Pelanggan</text>
    <rect x="1025" y="16" width="115" height="36" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="1082" y="39" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">Admin: Davy</text>
  </g>

