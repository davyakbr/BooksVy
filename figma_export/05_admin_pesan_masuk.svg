<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
    <linearGradient id="sidebarDarkGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#061611"/>
      <stop offset="50%" stop-color="#0A2119"/>
      <stop offset="100%" stop-color="#061510"/>
    </linearGradient>
    <linearGradient id="activeMenuGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.25)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.08)"/>
    </linearGradient>
  </defs>

  <!-- Background Content -->
  <rect width="1440" height="960" fill="#F8FAFC"/>

  <!-- ================= SIDEBAR ADMIN ================= -->
  <g id="AdminSidebar">
    <rect width="270" height="960" fill="url(#sidebarDarkGrad5)"/>
    <line x1="270" y1="0" x2="270" y2="960" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1"/>

    <g transform="translate(18, 20)">
      <rect width="234" height="60" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(16, 185, 129, 0.25)"/>
      <text x="16" y="34" font-size="20" font-weight="800" fill="#FFFFFF">Books<tspan fill="#34D399">Vy</tspan></text>
      <rect x="175" y="18" width="46" height="20" rx="5" fill="rgba(16, 185, 129, 0.25)" stroke="rgba(16, 185, 129, 0.4)"/>
      <text x="198" y="32" font-size="9" font-weight="800" fill="#6EE7B7" text-anchor="middle">ADMIN</text>
      <text x="16" y="50" font-size="10" font-weight="600" fill="rgba(255, 255, 255, 0.55)" letter-spacing="1">CONTROL CENTER</text>
    </g>

    <text x="25" y="115" font-size="10" font-weight="700" fill="rgba(255, 255, 255, 0.4)" letter-spacing="1.2">NAVIGASI UTAMA</text>

    <!-- Menu 1: Dashboard -->
    <g transform="translate(14, 125)">
      <rect width="242" height="40" rx="10" fill="transparent"/>
      <text x="18" y="25" font-size="13" font-weight="500" fill="rgba(255, 255, 255, 0.78)">Dashboard</text>
    </g>

    <!-- Menu 2: Data Buku -->
    <g transform="translate(14, 172)">
      <rect width="242" height="40" rx="10" fill="transparent"/>
      <text x="18" y="25" font-size="13" font-weight="500" fill="rgba(255, 255, 255, 0.78)">Data Buku</text>
    </g>

    <!-- Menu 3: Kategori -->
    <g transform="translate(14, 219)">
      <rect width="242" height="40" rx="10" fill="transparent"/>
      <text x="18" y="25" font-size="13" font-weight="500" fill="rgba(255, 255, 255, 0.78)">Kategori</text>
    </g>

    <!-- Menu 4: Pesanan -->
    <g transform="translate(14, 266)">
      <rect width="242" height="40" rx="10" fill="transparent"/>
      <text x="18" y="25" font-size="13" font-weight="500" fill="rgba(255, 255, 255, 0.78)">Pesanan</text>
    </g>

    <!-- Menu 5: Pengguna -->
