<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
    <linearGradient id="emeraldBtn2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="960" fill="#F8FAFC"/>

  <!-- Top Info Bar -->
  <rect width="1440" height="36" fill="#022C22"/>
  <text x="80" y="23" fill="#6EE7B7" font-size="12" font-weight="500">✨ Diskon Spesial Hari Ini: Gratis Ongkir Seluruh Indonesia &amp; Garansi Buku 100% Original</text>

  <!-- Navbar -->
  <g id="Navbar">
    <rect y="36" width="1440" height="80" fill="#FFFFFF"/>
    <line x1="0" y1="116" x2="1440" y2="116" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="86" font-size="26" font-weight="800" fill="#0F172A">Books<tspan fill="#10B981">Vy</tspan></text>
    <rect x="260" y="54" width="460" height="44" rx="22" fill="#F1F5F9" stroke="#CBD5E1"/>
    <circle cx="285" cy="76" r="6" stroke="#64748B" stroke-width="1.8" fill="none"/>
    <line x1="289" y1="80" x2="295" y2="86" stroke="#64748B" stroke-width="1.8"/>
    <text x="306" y="81" font-size="13" fill="#64748B">Cari judul buku, penulis, atau penerbit...</text>
    <text x="760" y="81" font-size="14" font-weight="500" fill="#475569">Beranda</text>
    <text x="840" y="81" font-size="14" font-weight="600" fill="#10B981">Katalog</text>
    <text x="915" y="81" font-size="14" font-weight="500" fill="#475569">Kategori</text>
    <text x="995" y="81" font-size="14" font-weight="500" fill="#475569">Kontak</text>
    <rect x="1150" y="56" width="42" height="42" rx="21" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="1164" y="82" font-size="16">🛒</text>
    <circle cx="1186" cy="62" r="9" fill="#EF4444"/>
    <text x="1186" y="66" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <rect x="1208" y="56" width="152" height="42" rx="21" fill="url(#emeraldBtn2)"/>
    <text x="1284" y="82" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Akun Saya &rarr;</text>
  </g>

  <!-- Breadcrumb -->
  <g id="Breadcrumb" transform="translate(80, 140)">
    <text x="0" y="15" font-size="13" fill="#64748B">Beranda &nbsp;/&nbsp; Katalog &nbsp;/&nbsp; Self Improvement &nbsp;/&nbsp; <tspan fill="#0F172A" font-weight="600">Atomic Habits</tspan></text>
  </g>

  <!-- Main Detail Card -->
  <g id="BookDetailCard" transform="translate(80, 175)">
    <rect width="1280" height="520" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/>

    <!-- Left: Big Book Cover -->
    <rect x="40" y="40" width="310" height="440" rx="14" fill="#065F46"/>
    <rect x="55" y="55" width="280" height="410" rx="10" fill="#044E3B" stroke="rgba(255,255,255,0.1)"/>
    <text x="195" y="230" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ATOMIC</text>
    <text x="195" y="270" font-size="28" font-weight="800" fill="#34D399" text-anchor="middle" letter-spacing="1">HABITS</text>
    <text x="195" y="305" font-size="13" fill="#D1FAE5" text-anchor="middle">James Clear</text>

    <!-- Right: Book Info & Purchase Controls -->
    <!-- Category Badge -->
    <rect x="390" y="40" width="135" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="457" y="59" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">SELF IMPROVEMENT</text>

    <!-- Title -->
    <text x="390" y="105" font-size="26" font-weight="800" fill="#0F172A">Atomic Habits: Perubahan Kecil yang Memberikan Hasil Luar Biasa</text>
    
    <!-- Meta Info -->
    <text x="390" y="140" font-size="14" fill="#64748B">Penulis: <tspan font-weight="600" fill="#1E293B">James Clear</tspan> &nbsp;&bull;&nbsp; Penerbit: <tspan font-weight="600" fill="#1E293B">Gramedia</tspan> &nbsp;&bull;&nbsp; Tahun: <tspan font-weight="600" fill="#1E293B">2023</tspan></text>
    <text x="390" y="165" font-size="14" fill="#F59E0B">★★★★★ <tspan fill="#64748B" font-size="13">(4.9 dari 1.250 pembaca)</tspan></text>

    <line x1="390" y1="185" x2="1240" y2="185" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Price Section -->
    <text x="390" y="225" font-size="32" font-weight="800" fill="#064E3B">Rp 98.000</text>
    <text x="560" y="225" font-size="18" fill="#94A3B8" text-decoration="line-through">Rp 115.000</text>
    <rect x="665" y="202" width="75" height="26" rx="6" fill="#FEE2E2"/>
    <text x="702" y="219" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">HEMAT 15%</text>

    <!-- Stock Badge -->
    <rect x="390" y="250" width="165" height="30" rx="8" fill="#ECFDF5"/>
    <text x="472" y="270" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">✓ Stok Tersedia (15 Unit)</text>

    <!-- Sinopsis Excerpt -->
    <text x="390" y="315" font-size="14" fill="#475569" font-weight="400">Atomic Habits menyajikan kerangka kerja praktis untuk memperbaiki kebiasaan sehari-hari.</text>
    <text x="390" y="338" font-size="14" fill="#475569" font-weight="400">Perubahan kecil 1% setiap hari akan berakumulasi menjadi transformasi hidup yang luar biasa.</text>

    <line x1="390" y1="365" x2="1240" y2="365" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Quantity & Actions (BooksVy Custom +/- Controls) -->
    <text x="390" y="405" font-size="14" font-weight="600" fill="#1E293B">Jumlah Pembelian:</text>
    
    <!-- [-] [ 1 ] [+] Selector with No Spin Button -->
    <g id="QtySelector" transform="translate(530, 385)">
      <rect x="0" y="0" width="40" height="40" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="20" y="25" font-size="18" font-weight="700" fill="#475569" text-anchor="middle">-</text>

      <rect x="48" y="0" width="60" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="78" y="25" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">1</text>

      <rect x="116" y="0" width="40" height="40" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="136" y="25" font-size="18" font-weight="700" fill="#475569" text-anchor="middle">+</text>
    </g>

    <text x="715" y="410" font-size="14" fill="#64748B">Maksimal pembelian: <tspan font-weight="600" fill="#0F172A">15 buku</tspan></text>

    <!-- Action Buttons -->
    <rect x="390" y="445" width="220" height="48" rx="24" fill="#10B981"/>
    <text x="500" y="475" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Tambah ke Keranjang</text>

    <rect x="625" y="445" width="180" height="48" rx="24" fill="#064E3B"/>
    <text x="715" y="475" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Beli Sekarang ➔</text>
  </g>

  <!-- Bottom Tabs Section (Sinopsis) -->
  <g id="BottomTabs" transform="translate(80, 725)">
    <rect width="1280" height="175" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    
    <!-- Tab Headers -->
    <rect x="25" y="20" width="160" height="36" rx="8" fill="#ECFDF5"/>
    <text x="105" y="43" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">Sinopsis Lengkap</text>

    <text x="260" y="43" font-size="13" font-weight="500" fill="#64748B">Detail Spesifikasi</text>
    <text x="400" y="43" font-size="13" font-weight="500" fill="#64748B">Ulasan Pelanggan (1.250)</text>

    <line x1="25" y1="65" x2="1255" y2="65" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Synopsis Text -->
    <text x="25" y="95" font-size="13" fill="#475569" line-height="22">Atomic Habits adalah buku panduan komprehensif mengenai cara mengubah kebiasaan buruk dan membangun kebiasaan baik dengan mudah.</text>
    <text x="25" y="120" font-size="13" fill="#475569">James Clear, salah satu pakar pembentukan kebiasaan terkemuka di dunia, menjelaskan strategi praktis yang telah terbukti secara ilmiah.</text>
    <text x="25" y="145" font-size="13" fill="#475569">Format: Soft Cover | Jumlah Halaman: 352 hlm | Bahasa: Indonesia | ISBN: 978-602-06-3317-6</text>
  </g>

  <!-- Footer Minimal -->
  <rect y="920" width="1440" height="40" fill="#0F172A"/>
  <text x="80" y="945" font-size="12" fill="#94A3B8">© 2026 BooksVy Bookstore — Detail Produk &amp; Transaksi Pelanggan</text>
</svg>
