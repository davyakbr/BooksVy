<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
    <linearGradient id="loginBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="emeraldBtn6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Deep Emerald Background -->
  <rect width="1440" height="900" fill="url(#loginBgGrad)"/>

  <!-- Subtle Ambient Glow Circles -->
  <circle cx="720" cy="450" r="450" fill="rgba(16, 185, 129, 0.08)"/>
  <circle cx="300" cy="200" r="250" fill="rgba(52, 211, 153, 0.05)"/>

  <!-- Back to Store Link (Top Left) -->
  <text x="80" y="60" font-size="14" font-weight="600" fill="#A7F3D0" cursor="pointer">&larr; Kembali ke Beranda Toko</text>

  <!-- Center Auth Card (480 x 620) -->
  <g transform="translate(480, 110)">
    <rect width="480" height="660" rx="24" fill="#FFFFFF" stroke="rgba(255, 255, 255, 0.2)"/>
    
    <!-- Logo & Header -->
    <text x="240" y="65" font-size="32" font-weight="800" fill="#0F172A" text-anchor="middle">Books<tspan fill="#10B981">Vy</tspan></text>
    <text x="240" y="95" font-size="18" font-weight="700" fill="#1E293B" text-anchor="middle">Selamat Datang Kembali!</text>
    <text x="240" y="118" font-size="13" fill="#64748B" text-anchor="middle">Masuk untuk melanjutkan pesanan &amp; akses dashboard</text>

    <!-- Form Inputs -->
    <!-- Input 1: Email / Username -->
    <g transform="translate(40, 150)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#475569">ALAMAT EMAIL / NAMA</text>
      <rect x="0" y="10" width="400" height="46" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="16" y="38" font-size="13" fill="#1E293B">admin@booksvy.com</text>
    </g>

    <!-- Input 2: Password -->
    <g transform="translate(40, 235)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#475569">KATA SANDI (PASSWORD)</text>
      <rect x="0" y="10" width="400" height="46" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="16" y="40" font-size="18" fill="#1E293B">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</text>
      <text x="365" y="38" font-size="15" fill="#64748B" cursor="pointer">👁️</text>
    </g>

    <!-- Remember Me & Forgot Password -->
    <g transform="translate(40, 320)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#10B981"/>
      <text x="8" y="13" font-size="12" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="26" y="13" font-size="12" fill="#475569">Ingat Saya</text>

      <text x="400" y="13" font-size="12" font-weight="600" fill="#10B981" text-anchor="end" cursor="pointer">Lupa Password?</text>
    </g>

    <!-- Submit Button: Masuk Sekarang -->
    <g transform="translate(40, 355)">
      <rect width="400" height="48" rx="24" fill="url(#emeraldBtn6)"/>
      <text x="200" y="30" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Masuk ke Akun Sekarang &rarr;</text>
    </g>

    <!-- Divider -->
    <line x1="40" y1="435" x2="440" y2="435" stroke="#F1F5F9" stroke-width="1.5"/>
    <rect x="200" y="425" width="80" height="20" rx="4" fill="#FFFFFF"/>
    <text x="240" y="439" font-size="11" fill="#94A3B8" text-anchor="middle">ATAU</text>

    <!-- Register Button -->
    <g transform="translate(40, 465)">
      <rect width="400" height="44" rx="22" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="200" y="27" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Belum punya akun? Daftar Pelanggan Baru</text>
    </g>

    <!-- Demo Credentials Box (USK Support) -->
    <g transform="translate(40, 535)">
      <rect width="400" height="85" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="15" y="22" font-size="11" font-weight="700" fill="#065F46">🔑 AKUN UJI COBA (LOGIN DEMO):</text>
      <text x="15" y="44" font-size="11" fill="#047857">• <tspan font-weight="600">Admin:</tspan> admin@booksvy.com &bull; Pass: <tspan font-weight="600">password</tspan></text>
      <text x="15" y="65" font-size="11" fill="#047857">• <tspan font-weight="600">Pelanggan:</tspan> davy@gmail.com &bull; Pass: <tspan font-weight="600">password</tspan></text>
    </g>
  </g>
</svg>
