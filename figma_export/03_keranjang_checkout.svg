<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
    <linearGradient id="emeraldBtn3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="960" fill="#F8FAFC"/>

  <!-- Navbar -->
  <g id="Navbar">
    <rect y="0" width="1440" height="80" fill="#FFFFFF"/>
    <line x1="0" y1="80" x2="1440" y2="80" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="50" font-size="26" font-weight="800" fill="#0F172A">Books<tspan fill="#10B981">Vy</tspan></text>
    <text x="760" y="47" font-size="14" font-weight="500" fill="#475569">Beranda</text>
    <text x="840" y="47" font-size="14" font-weight="500" fill="#475569">Katalog</text>
    <text x="915" y="47" font-size="14" font-weight="500" fill="#475569">Kategori</text>
    <text x="995" y="47" font-size="14" font-weight="500" fill="#475569">Kontak</text>
    <rect x="1208" y="20" width="152" height="42" rx="21" fill="url(#emeraldBtn3)"/>
    <text x="1284" y="46" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Akun Saya &rarr;</text>
  </g>

  <!-- Page Title -->
  <g id="HeaderTitle" transform="translate(80, 110)">
    <text x="0" y="22" font-size="24" font-weight="800" fill="#0F172A">🛒 Keranjang Belanja &amp; Checkout</text>
    <text x="0" y="44" font-size="13" fill="#64748B">Periksa kembali buku pilihan Anda sebelum menyelesaikan transaksi pembayaran</text>
  </g>

  <!-- Left Column: Cart Items List -->
  <g id="CartItems" transform="translate(80, 180)">
    <rect width="780" height="690" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    
    <!-- Table Header -->
    <rect x="20" y="20" width="740" height="40" rx="8" fill="#F8FAFC"/>
    <text x="40" y="45" font-size="12" font-weight="700" fill="#64748B">PRODUK BUKU</text>
    <text x="360" y="45" font-size="12" font-weight="700" fill="#64748B">HARGA</text>
    <text x="480" y="45" font-size="12" font-weight="700" fill="#64748B">JUMLAH</text>
    <text x="610" y="45" font-size="12" font-weight="700" fill="#64748B">SUBTOTAL</text>

    <!-- Item 1: Atomic Habits -->
    <g transform="translate(20, 80)">
      <rect x="20" y="10" width="55" height="75" rx="6" fill="#065F46"/>
      <text x="47" y="52" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">ATOMIC</text>
      <text x="90" y="32" font-size="14" font-weight="700" fill="#0F172A">Atomic Habits</text>
      <text x="90" y="52" font-size="12" fill="#64748B">Penulis: James Clear</text>
      <text x="90" y="70" font-size="11" fill="#10B981">Stok: 15</text>

      <text x="340" y="52" font-size="13" font-weight="600" fill="#1E293B">Rp 98.000</text>

      <!-- Qty Controls [-] 1 [+] -->
      <rect x="460" y="32" width="28" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="474" y="51" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">-</text>
      <rect x="494" y="32" width="38" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="513" y="51" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">1</text>
      <rect x="538" y="32" width="28" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="552" y="51" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">+</text>

      <text x="590" y="52" font-size="14" font-weight="800" fill="#064E3B">Rp 98.000</text>
      <text x="700" y="52" font-size="15" fill="#EF4444" cursor="pointer">🗑️</text>
      <line x1="20" y1="95" x2="720" y2="95" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Item 2: Filosofi Teras -->
    <g transform="translate(20, 195)">
      <rect x="20" y="10" width="55" height="75" rx="6" fill="#1E293B"/>
      <text x="47" y="52" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">TERAS</text>
      <text x="90" y="32" font-size="14" font-weight="700" fill="#0F172A">Filosofi Teras</text>
      <text x="90" y="52" font-size="12" fill="#64748B">Penulis: Henry Manampiring</text>
      <text x="90" y="70" font-size="11" fill="#10B981">Stok: 8</text>

      <text x="340" y="52" font-size="13" font-weight="600" fill="#1E293B">Rp 88.000</text>

      <!-- Qty Controls [-] 2 [+] -->
      <rect x="460" y="32" width="28" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="474" y="51" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">-</text>
      <rect x="494" y="32" width="38" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="513" y="51" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">2</text>
      <rect x="538" y="32" width="28" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="552" y="51" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">+</text>

      <text x="590" y="52" font-size="14" font-weight="800" fill="#064E3B">Rp 176.000</text>
      <text x="700" y="52" font-size="15" fill="#EF4444" cursor="pointer">🗑️</text>
      <line x1="20" y1="95" x2="720" y2="95" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Item 3: Berani Tidak Disukai -->
    <g transform="translate(20, 310)">
      <rect x="20" y="10" width="55" height="75" rx="6" fill="#831843"/>
      <text x="47" y="52" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">BERANI</text>
      <text x="90" y="32" font-size="14" font-weight="700" fill="#0F172A">Berani Tidak Disukai</text>
      <text x="90" y="52" font-size="12" fill="#64748B">Penulis: Ichiro Kishimi</text>
      <text x="90" y="70" font-size="11" fill="#10B981">Stok: 7</text>

      <text x="340" y="52" font-size="13" font-weight="600" fill="#1E293B">Rp 98.000</text>

      <!-- Qty Controls [-] 1 [+] -->
      <rect x="460" y="32" width="28" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="474" y="51" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">-</text>
      <rect x="494" y="32" width="38" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="513" y="51" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">1</text>
      <rect x="538" y="32" width="28" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="552" y="51" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">+</text>

      <text x="590" y="52" font-size="14" font-weight="800" fill="#064E3B">Rp 98.000</text>
      <text x="700" y="52" font-size="15" fill="#EF4444" cursor="pointer">🗑️</text>
      <line x1="20" y1="95" x2="720" y2="95" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Info Promo Box -->
    <rect x="40" y="450" width="700" height="60" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="60" y="475" font-size="13" font-weight="700" fill="#065F46">🎉 Selamat! Pesanan Anda memenuhi syarat Gratis Ongkir</text>
    <text x="60" y="495" font-size="12" fill="#047857">Belanja di atas Rp 150.000 mendapatkan subsidi ongkos kirim ke seluruh kota di Indonesia.</text>

    <!-- Back to Store Link -->
    <text x="40" y="550" font-size="13" font-weight="600" fill="#10B981">&larr; Lanjut Tambah Buku Lain</text>
  </g>

  <!-- Right Column: Checkout Summary & Form -->
  <g id="OrderSummary" transform="translate(890, 180)">
    <rect width="470" height="690" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    
    <text x="30" y="45" font-size="18" font-weight="800" fill="#0F172A">Ringkasan Pembayaran</text>
    <line x1="30" y1="65" x2="440" y2="65" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Form Inputs (Delivery Details) -->
    <text x="30" y="95" font-size="12" font-weight="700" fill="#475569">NAMA PENERIMA</text>
    <rect x="30" y="105" width="410" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="45" y="130" font-size="13" fill="#1E293B">Davy Akbar</text>

    <text x="30" y="170" font-size="12" font-weight="700" fill="#475569">NO. WHATSAPP / TELEPON</text>
    <rect x="30" y="180" width="410" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="45" y="205" font-size="13" fill="#1E293B">081234567890</text>

    <text x="30" y="245" font-size="12" font-weight="700" fill="#475569">ALAMAT LENGKAP PENGIRIMAN</text>
    <rect x="30" y="255" width="410" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="45" y="280" font-size="12" fill="#1E293B">Jl. Merdeka No. 45, Kebayoran Baru, Jakarta Selatan</text>

    <!-- Payment Methods Selection -->
    <text x="30" y="340" font-size="12" font-weight="700" fill="#475569">METODE PEMBAYARAN</text>
    
    <!-- Option 1: Transfer Bank (Active) -->
    <rect x="30" y="355" width="410" height="42" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="50" cy="376" r="6" fill="#10B981"/>
    <text x="70" y="381" font-size="13" font-weight="600" fill="#065F46">Transfer Bank (BCA / Mandiri / BNI)</text>

    <!-- Option 2: COD -->
    <rect x="30" y="405" width="410" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="50" cy="426" r="6" stroke="#94A3B8" fill="none"/>
    <text x="70" y="431" font-size="13" font-weight="500" fill="#475569">COD (Bayar Tunai di Tempat)</text>

    <line x1="30" y1="465" x2="440" y2="465" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Cost Breakdown -->
    <text x="30" y="495" font-size="13" fill="#64748B">Subtotal Produk (4 item)</text>
    <text x="440" y="495" font-size="13" font-weight="600" fill="#1E293B" text-anchor="end">Rp 372.000</text>

    <text x="30" y="525" font-size="13" fill="#64748B">Ongkos Kirim Reguler</text>
    <text x="440" y="525" font-size="13" font-weight="600" fill="#10B981" text-anchor="end">GRATIS (Rp 0)</text>

    <text x="30" y="555" font-size="13" fill="#64748B">Biaya Layanan Sistem</text>
    <text x="440" y="555" font-size="13" font-weight="600" fill="#1E293B" text-anchor="end">Rp 1.000</text>

    <line x1="30" y1="575" x2="440" y2="575" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Total Payment -->
    <text x="30" y="605" font-size="15" font-weight="700" fill="#0F172A">Total Tagihan:</text>
    <text x="440" y="605" font-size="22" font-weight="800" fill="#064E3B" text-anchor="end">Rp 373.000</text>

    <!-- Checkout Button -->
    <rect x="30" y="625" width="410" height="48" rx="24" fill="url(#emeraldBtn3)"/>
    <text x="235" y="655" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bayar &amp; Proses Pesanan Sekarang ➔</text>
  </g>

  <!-- Footer Minimal -->
  <rect y="920" width="1440" height="40" fill="#0F172A"/>
  <text x="80" y="945" font-size="12" fill="#94A3B8">© 2026 BooksVy Bookstore — Keranjang &amp; Transaksi Pembayaran</text>
</svg>
